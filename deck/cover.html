<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#0a0b0d; --panel:#121417; --panel2:#171a1e; --line:#23262b; --line2:#34383f;
    --ink:#eef0f2; --muted:#8b929c; --muted2:#5a6069; --accent:#22e0d8; --healthy:#34d399; --warn:#f5a623;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  body{font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .slide{
    width:1920px;height:1080px;background:var(--board);position:relative;overflow:hidden;
    padding:96px 112px;display:flex;flex-direction:column;page-break-after:always;
  }
  .slide::after{ /* the cyan edge that runs through the whole brand */
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);
  }
  .eyebrow{font-family:"Martian Mono",monospace;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .eyebrow b{color:var(--accent);font-weight:600}
  h1{font-size:112px;line-height:1.02;letter-spacing:-.025em;font-weight:700;margin-top:28px;max-width:26ch}
  h2{font-size:62px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin-top:22px;max-width:24ch}
  .lede{font-size:31px;line-height:1.5;color:var(--muted);margin-top:28px;max-width:46ch}
  .foot{position:absolute;left:112px;right:112px;bottom:56px;display:flex;justify-content:space-between;
        font-family:"Martian Mono",monospace;font-size:17px;color:var(--muted2);letter-spacing:.1em;text-transform:uppercase}
  .grid{display:grid;gap:28px;margin-top:auto;margin-bottom:56px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 34px 30px}
  .card .k{font-family:"Martian Mono",monospace;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .card .v{font-size:58px;font-weight:700;margin-top:12px;letter-spacing:-.02em}
  .card .d{font-size:22px;line-height:1.45;color:var(--muted);margin-top:12px}
  .accent{color:var(--accent)} .ok{color:var(--healthy)} .warn{color:var(--warn)}
  .mono{font-family:"Martian Mono",monospace}
  table{width:100%;border-collapse:collapse;margin-top:36px;font-size:25px}
  th{text-align:left;font-family:"Martian Mono",monospace;font-size:16px;letter-spacing:.14em;text-transform:uppercase;
     color:var(--muted);padding-bottom:18px;border-bottom:1px solid var(--line)}
  td{padding:22px 0;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
  td.m{color:var(--muted)}
  .pill{display:inline-block;font-family:"Martian Mono",monospace;font-size:34px;letter-spacing:.08em;
        border:2px solid var(--accent);color:var(--accent);border-radius:12px;padding:14px 26px}
  .bars{display:flex;gap:14px;align-items:center;margin-top:18px}
  .bar{height:46px;border-radius:8px;background:var(--line);flex:1}
  .quote{font-size:30px;line-height:1.5;color:var(--ink);border-left:3px solid var(--line2);padding-left:30px;margin-top:30px;max-width:52ch}
  .quote cite{display:block;font-style:normal;font-size:20px;color:var(--muted2);margin-top:16px;font-family:"Martian Mono",monospace}
  ul{margin-top:26px;list-style:none} li{font-size:27px;line-height:1.5;color:var(--muted);margin-bottom:18px;padding-left:34px;position:relative;max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:14px;width:16px;height:2px;background:var(--accent)}
  li b{color:var(--ink);font-weight:600}
  @page{size:1920px 1080px;margin:0}

.slide{justify-content:center}
h1{font-size:96px;max-width:22ch;margin-top:20px}
.grid{margin-top:52px;margin-bottom:0}
.brand{font-family:"Martian Mono",monospace;font-size:26px;letter-spacing:.08em;font-weight:600}
.brand span{color:var(--accent)}
</style></head><body>
<section class="slide">
  <p class="brand">AYEOPS<span>.</span></p>
  <h1>The code that authorizes a change never reaches the model.</h1>
  <div class="grid g2">
    <div class="card">
      <p class="k">Your screen</p>
      <p style="margin-top:20px"><span class="pill">HOTEL</span> &nbsp; <span class="pill">ALPHA</span></p>
      <p class="d" style="margin-top:20px">Read it aloud to authorize.</p>
    </div>
    <div class="card">
      <p class="k">Model context</p>
      <div class="bars"><span class="bar"></span><span class="bar"></span></div>
      <p class="d" style="margin-top:20px">Withheld. The agent cannot say it.</p>
    </div>
  </div>
  <div class="foot"><span>Voice-authorized incident command</span><span>ayeops.vexralabs.com</span></div>
</section></body></html>
