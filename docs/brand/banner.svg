<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <rect width="1280" height="320" fill="#0a0b0d"/>
  <rect x="0" y="318" width="1280" height="2" fill="#23262b"/>

  <!-- icon mark -->
  <rect x="64" y="100" width="48" height="48" rx="9" fill="#0a0b0d" stroke="#23262b" stroke-width="1.5"/>
  <text x="67" y="130" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="10.5" font-weight="700" letter-spacing="-0.6" fill="#eef0f2">AYEOPS<tspan fill="#22e0d8">.</tspan></text>

  <!-- wordmark -->
  <text x="132" y="150" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="40" font-weight="700" letter-spacing="1.5" fill="#eef0f2">AYEOPS<tspan fill="#22e0d8">.</tspan></text>

  <!-- eyebrow -->
  <circle cx="138" cy="181" r="3" fill="#34d399"/>
  <text x="150" y="185" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="12.5" letter-spacing="3" fill="#8b929c">VOICE INCIDENT COMMAND</text>

  <!-- mechanism line -->
  <text x="64" y="222" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#eef0f2">The code that authorizes a change. The model never sees it.</text>

  <!-- clearance card -->
  <rect x="760" y="48" width="452" height="224" rx="12" fill="#121417" stroke="#22e0d8" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1188" cy="72" r="4" fill="#22e0d8"/>
  <text x="788" y="80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="1.5" fill="#8b929c">AWAITING VOICE AUTHORIZATION</text>
  <text x="788" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600" fill="#eef0f2">Roll back auth-service</text>
  <text x="788" y="134" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b929c">v2.14.1 &#8594; v2.14.0 &#183; affects api-gateway, billing-worker</text>

  <!-- code word pills -->
  <rect x="788" y="156" width="90" height="40" rx="8" fill="#22e0d8" fill-opacity="0.07" stroke="#22e0d8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="833" y="182" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="18" font-weight="700" letter-spacing="1" fill="#22e0d8">LIMA</text>
  <rect x="894" y="156" width="120" height="40" rx="8" fill="#22e0d8" fill-opacity="0.07" stroke="#22e0d8" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="954" y="182" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="18" font-weight="700" letter-spacing="1" fill="#22e0d8">CHARLIE</text>

  <text x="788" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#8b929c">Say: <tspan font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace" fill="#eef0f2">&#8220;Roll back auth-service, Lima Charlie.&#8221;</tspan></text>

  <!-- progress -->
  <rect x="788" y="244" width="396" height="4" rx="2" fill="#23262b"/>
  <rect x="788" y="244" width="264" height="4" rx="2" fill="#22e0d8"/>

  <!-- mechanism callout -->
  <text x="788" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-style="italic" fill="#5a6069">&#8593; generated by the relay &#8212; never sent to the model</text>
</svg>
