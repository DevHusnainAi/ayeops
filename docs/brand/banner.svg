<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img"
     aria-label="AyeOps — the code that authorizes a change never reaches the model">
  <rect width="1280" height="320" fill="#0a0b0d"/>
  <rect x="0" y="317" width="1280" height="3" fill="#191c20"/>

  <!-- identity: icon, wordmark, eyebrow and one claim, all on a single left edge at x=64 -->
  <rect x="64" y="100" width="44" height="44" rx="9" fill="#0a0b0d" stroke="#23262b" stroke-width="1.5"/>
  <rect x="72" y="114" width="28" height="17" rx="2" fill="#ece4cf"/>
  <rect x="72" y="114" width="4" height="17" fill="#22e0d8"/>
  <text x="122" y="137" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="40" font-weight="700" letter-spacing="1.5" fill="#eef0f2">AYEOPS<tspan fill="#22e0d8">.</tspan></text>
  <text x="64" y="180" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="12" letter-spacing="3.2" fill="#8b929c">VOICE-AUTHORIZED INCIDENT COMMAND</text>
  <text x="64" y="222" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" fill="#eef0f2">The code that authorizes a change</text>
  <text x="64" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" fill="#eef0f2">never reaches the model.</text>
  <text x="64" y="284" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="11" letter-spacing="2.4" fill="#5a6069">BLIND &#183; VOICED &#183; LOGGED</text>

  <!-- the same moment, twice: what the operator sees, and what the model gets -->
  <rect x="604" y="52" width="300" height="216" rx="12" fill="#121417" stroke="#22e0d8" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="634" cy="80" r="3.5" fill="#22e0d8"/>
  <text x="648" y="84" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="11" letter-spacing="1.8" fill="#8b929c">YOUR SCREEN</text>
  <text x="628" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="18" font-weight="600" fill="#eef0f2">Roll back auth-service</text>
  <text x="628" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12.5" fill="#8b929c">v2.14.1 &#8594; v2.14.0</text>
  <rect x="628" y="164" width="84" height="40" rx="8" fill="#22e0d8" fill-opacity="0.08" stroke="#22e0d8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="670" y="190" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="17" font-weight="700" letter-spacing="1" fill="#22e0d8">LIMA</text>
  <rect x="722" y="164" width="112" height="40" rx="8" fill="#22e0d8" fill-opacity="0.08" stroke="#22e0d8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="778" y="190" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="17" font-weight="700" letter-spacing="1" fill="#22e0d8">CHARLIE</text>
  <text x="628" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12.5" fill="#8b929c">Read it aloud to authorize.</text>

  <rect x="924" y="52" width="300" height="216" rx="12" fill="#0e1013" stroke="#23262b" stroke-width="1.5"/>
  <circle cx="954" cy="80" r="3.5" fill="#3a3f46"/>
  <text x="968" y="84" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', monospace"
        font-size="11" letter-spacing="1.8" fill="#6b727b">MODEL CONTEXT</text>
  <text x="948" y="122" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="18" font-weight="600" fill="#8b929c">Roll back auth-service</text>
  <text x="948" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12.5" fill="#5a6069">v2.14.1 &#8594; v2.14.0</text>
  <rect x="948" y="164" width="84" height="40" rx="8" fill="#15181c" stroke="#23262b" stroke-width="1.5"/>
  <g fill="#2b3037">
    <rect x="962" y="178" width="24" height="12" rx="2"/><rect x="992" y="178" width="14" height="12" rx="2"/>
  </g>
  <rect x="1042" y="164" width="112" height="40" rx="8" fill="#15181c" stroke="#23262b" stroke-width="1.5"/>
  <g fill="#2b3037">
    <rect x="1056" y="178" width="30" height="12" rx="2"/><rect x="1092" y="178" width="18" height="12" rx="2"/>
    <rect x="1116" y="178" width="24" height="12" rx="2"/>
  </g>
  <text x="948" y="238" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12.5" fill="#6b727b">Withheld. The agent cannot say it.</text>
</svg>
